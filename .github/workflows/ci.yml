name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      # 테스트를 위해 PostgreSQL 컨테이너를 실행
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: discord_db
          ## Todo[ ] 나중에는 User와 Password도 따라서 변경이 되어야한다. 
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # 서비스가 준비될 때까지 대기
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure() # 항상 실행
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'
