# 실행: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 필수 환경변수: SERVER_PUBLIC_IP

services:
  signal-api:
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      # standalone 설정을 덮어씌움 (Sentinel 우선)
      SPRING_DATA_REDIS_HOST: ""
      SPRING_DATA_REDIS_PORT: ""

  signal-chat:
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_DATA_REDIS_HOST: ""
      SPRING_DATA_REDIS_PORT: ""

  signal-media:
    environment:
      MEDIASOUP_ANNOUNCED_IP: ${SERVER_PUBLIC_IP:?SERVER_PUBLIC_IP must be set}
