version: '3.8'

# 일단 빠른 test용 postgreSQL 만들기
services:
  db:
    image: postgres:15-alpine
    container_name: discord_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: discord_db
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: signal_rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
      - "61613:61613" # STOMP
    command: /bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"

  redis:
    image: redis:alpine
    container_name: signal_redis
    ports:
      - "6379:6379"


