version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: signal_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    command: /bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signal_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  signal-media:
    build:
      context: ./signal-media
      dockerfile: Dockerfile
    container_name: signal_media
    profiles: ["prod"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
    ports:
      - "10000-10100:10000-10100/udp"
    depends_on:
      rabbitmq:
        condition: service_healthy